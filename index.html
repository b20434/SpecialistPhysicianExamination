<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>專科醫師考試通過率儀表板</title>
<style>
/* ==========================================================================
   響應式設計：Mobile First
   手機樣式為預設值，再用 min-width 往上疊加平板（48em=768px）與桌機（64em=1024px）。
   字級一律使用 rem 或 clamp()，不使用固定 px。
   ========================================================================== */

html{
  font-size:100%;                 /* 尊重使用者的瀏覽器預設字級，1rem 通常 = 16px */
  -webkit-text-size-adjust:100%;
}

:root{
  --paper:#F7F8F6; --card:#FFFFFF; --ink:#1B2430; --slate:#46596E; --mute:#8A98A6;
  --rule:#DDE2E6; --teal:#0F6D6B; --teal-soft:#D7E8E7; --brick:#B4462F; --brick-soft:#F3DED8;

  /* 隨裝置改變的尺度變數：手機版預設值 */
  --lh:1.58;                      /* 行距：窄螢幕行長較短，行距可略緊 */
  --lh-loose:1.7;                  /* 說明文字用的寬鬆行距 */
  --fs-sub:clamp(0.78125rem, 0.755rem + 0.14vw, 0.875rem);   /* 標題下方的說明行 */
  --fs-micro:clamp(0.6875rem, 0.665rem + 0.12vw, 0.78125rem);/* 標籤、註記等小字 */
  --gutter:1.125rem;              /* 左右留白 */
  --section-gap:2rem;             /* 區塊上下間距 */
  --dot:0.8125rem;                /* 方格圖每一格的邊長 */
  --pad-card:1rem;                /* 卡片內距 */
}

*,*::before,*::after{box-sizing:border-box}

body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,"Segoe UI",sans-serif;
  font-size:clamp(0.875rem, 0.83rem + 0.22vw, 0.9375rem);
  line-height:var(--lh); font-feature-settings:"tnum" 1;
}

.wrap{width:100%; max-width:67.5rem; margin-inline:auto; padding-inline:var(--gutter); padding-bottom:4rem}

h1,h2,h3{font-weight:700;letter-spacing:.01em;margin:0}
a{color:var(--teal)}

/* ---------- 頁首 ---------- */
header{padding-block:2rem 1.5rem;border-bottom:2px solid var(--ink)}
h1{font-size:clamp(1.375rem, 1.1rem + 1.6vw, 1.9375rem);line-height:1.25}
.sub{margin-block:.5rem 0;color:var(--slate);font-size:var(--fs-sub);line-height:var(--lh-loose)}
.meta{margin-top:.875rem;display:flex;flex-wrap:wrap;gap:.25rem 1.5rem;font-size:var(--fs-micro);color:var(--mute)}

section{padding-block:var(--section-gap);border-bottom:1px solid var(--rule)}
section:last-of-type{border-bottom:0;padding-bottom:calc(var(--section-gap) / 2)}
h2{font-size:clamp(1.0625rem, 0.98rem + 0.5vw, 1.25rem)}
.lead{margin:.5rem 0 1.25rem;color:var(--slate);font-size:var(--fs-sub);line-height:var(--lh-loose);max-width:62ch}

/* ---------- KPI：手機 2 欄 → 桌機 4 欄 ---------- */
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--rule);border:1px solid var(--rule)}
.kpi{background:var(--card);padding:clamp(0.875rem,0.7rem+0.6vw,1.25rem)}
.kpi .k{font-size:var(--fs-micro);color:var(--mute);line-height:var(--lh)}
.kpi .v{font-size:clamp(1.5rem, 1.15rem + 1.6vw, 2.125rem);font-weight:700;line-height:1.15;margin-top:.25rem;letter-spacing:-.02em}
.kpi .d{font-size:var(--fs-micro);color:var(--slate);margin-top:.25rem;line-height:var(--lh-loose)}
.kpi.alert .v{color:var(--brick)}
.up{color:var(--teal);font-weight:700}
.down{color:var(--brick);font-weight:700}

/* ---------- 方格圖：手機／平板單欄 → 桌機兩欄並排 ---------- */
.units{display:grid;grid-template-columns:1fr;gap:1.25rem}
.unitbox{background:var(--card);border:1px solid var(--rule);padding:var(--pad-card)}
.unitbox h3{font-size:var(--fs-sub);display:flex;align-items:baseline;gap:.625rem;flex-wrap:wrap}
.unitbox h3 span{font-size:var(--fs-micro);color:var(--mute);font-weight:400}
.grid{display:flex;flex-wrap:wrap;gap:.25rem;margin-top:.875rem}
.dot{width:var(--dot);height:var(--dot);background:var(--slate);border-radius:2px;cursor:default}
.dot.f{background:var(--brick)}
.dot.sub{background:var(--teal)}
.dot.sub.f{background:var(--brick)}
@media (prefers-reduced-motion:no-preference){.dot{animation:pop .34s ease-out both}}
@keyframes pop{from{opacity:0;transform:scale(.55)}to{opacity:1;transform:scale(1)}}
.legend{display:flex;flex-wrap:wrap;gap:.5rem 1.125rem;margin-top:1rem;font-size:var(--fs-micro);color:var(--slate)}
.legend i{display:inline-block;width:.7rem;height:.7rem;border-radius:2px;margin-right:.35rem;vertical-align:-1px}
.unitfoot{margin-top:.875rem;font-size:var(--fs-sub);color:var(--slate);line-height:var(--lh-loose)}
.unitfoot b{font-size:1.125rem;color:var(--ink)}

/* 觸控裝置沒有滑鼠 hover，提示框只在有滑鼠的裝置啟用 */
#tip{position:fixed;z-index:50;background:var(--ink);color:#fff;font-size:0.75rem;padding:.3rem .55rem;border-radius:3px;pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;display:none}
@media (hover:hover) and (pointer:fine){#tip{display:block}}

/* ---------- 未通過名單：手機堆疊 → 桌機三欄 ---------- */
.exc{background:var(--card);border:1px solid var(--rule);border-left:3px solid var(--brick)}
.excrow{display:grid;grid-template-columns:1fr;gap:.125rem;padding:.875rem 1rem;border-bottom:1px solid var(--rule)}
.excrow:last-child{border-bottom:0}
.excrow .yr{font-weight:700;font-size:var(--fs-sub)}
.excrow .nm{font-weight:700;color:var(--brick);font-size:clamp(0.9375rem,0.9rem+0.2vw,1rem)}
.excrow .no{font-size:var(--fs-sub);color:var(--slate);line-height:var(--lh-loose)}

/* ---------- 明細表 ----------
   手機：每一列變成一張卡片，欄位名稱用 td::before + data-label 顯示
   平板以上：還原成正常表格 */
.tabs{display:flex;gap:2px;margin-bottom:1rem}
.tab{flex:1;border:1px solid var(--rule);background:var(--card);color:var(--slate);
     padding:.5rem .5rem;font:inherit;font-size:var(--fs-sub);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.tab:focus-visible{outline:2px solid var(--teal);outline-offset:2px}

table{width:100%;border-collapse:collapse;font-size:var(--fs-sub);line-height:var(--lh);background:transparent}
#detail thead{display:none}
#detail tbody tr,#detail tfoot tr{
  display:block;background:var(--card);border:1px solid var(--rule);margin-bottom:.625rem}
#detail td{display:flex;justify-content:space-between;align-items:baseline;gap:1rem;
  padding:.4rem .75rem;border-bottom:1px dotted var(--rule);text-align:right}
#detail td::before{content:attr(data-label);color:var(--mute);font-size:var(--fs-micro);
  font-weight:400;text-align:left;white-space:nowrap}
#detail td:last-child{border-bottom:0}
#detail td.nm{background:#EEF1F3;font-size:clamp(0.875rem,0.85rem+0.2vw,0.9375rem);font-weight:700;justify-content:flex-start}
#detail td.nm::before{content:none}
#detail td.cat{color:var(--mute)}
/* 手機：隱藏獨立的應考／通過欄，改用合併欄 .mob；類別併進標題列 */
#detail td.num{display:none}
.mobcat{color:var(--mute);font-weight:400;font-size:var(--fs-micro);margin-left:.35rem}
#detail tfoot tr{border:2px solid var(--ink)}
td.miss{background:var(--brick-soft)}
td.rate.miss{color:var(--brick);font-weight:700}
.dash{color:var(--mute)}
.bar{display:inline-block;height:.4rem;background:var(--teal);vertical-align:1px;border-radius:1px}
.bar.f{background:var(--brick)}

/* ---------- 摺疊區塊：明細表預設收合，需要時才展開 ---------- */
.disclosure{border:1px solid var(--rule);background:var(--card)}
.disclosure summary{
  list-style:none; cursor:pointer; user-select:none;
  display:flex; align-items:center; gap:.5rem;
  padding:.75rem 1rem; font-size:var(--fs-sub); font-weight:700; color:var(--ink);
}
.disclosure summary::-webkit-details-marker{display:none}
.disclosure summary::before{               /* 自繪三角形指示器 */
  content:""; flex:none;
  width:0; height:0;
  border-left:.4rem solid var(--teal);
  border-top:.3rem solid transparent;
  border-bottom:.3rem solid transparent;
  transition:transform .18s ease;
}
.disclosure[open] summary::before{transform:rotate(90deg)}
.disclosure summary:hover{background:#EEF1F3}
.disclosure summary:focus-visible{outline:2px solid var(--teal);outline-offset:-2px}
.lbl-hide{display:none}
.disclosure[open] #lbl-show{display:none}
.disclosure[open] .lbl-hide{display:inline}
.disclosure-body{padding:0 1rem 1rem;border-top:1px solid var(--rule)}
.disclosure-body .tabs{margin-top:1rem}
@media (prefers-reduced-motion:reduce){.disclosure summary::before{transition:none}}

/* ---------- 結構分析：手機單欄 → 平板以上兩欄 ---------- */
.split{display:grid;grid-template-columns:1fr;gap:1rem}
.mini{background:var(--card);border:1px solid var(--rule);padding:var(--pad-card)}
.mini h3{font-size:var(--fs-sub);margin-bottom:.875rem}
.mrow{display:grid;grid-template-columns:4rem 1fr 4rem;gap:.625rem;align-items:center;padding:.4rem 0;font-size:var(--fs-sub)}
.track{height:.5rem;background:var(--brick-soft)}
.fill{height:.5rem;background:var(--teal)}
.mrow .val{text-align:right;font-weight:700}

.notes{font-size:clamp(0.8125rem,0.78rem+0.2vw,0.875rem);line-height:var(--lh-loose);color:var(--slate);max-width:70ch;padding-left:1.25rem}
.notes li{margin-bottom:.45rem}


/* ==========================================================================
   斷點一：平板 768px 以上
   ========================================================================== */
@media (min-width:48em){
  :root{ --lh:1.65; --lh-loose:1.75;
         --gutter:1.75rem; --section-gap:2.75rem; --dot:0.9375rem; --pad-card:1.25rem; }

  header{padding-block:3rem 2rem}
  .meta{gap:.5rem 1.625rem}

  /* 未通過名單改為三欄對齊 */
  .excrow{grid-template-columns:4.5rem 9rem 1fr;gap:.875rem;align-items:baseline;padding:.875rem 1.25rem}
  .excrow .nm{font-size:0.9375rem}

  /* 明細表還原成表格 */
  .tabs{display:inline-flex}
  .tab{flex:0 0 auto;padding:.45rem 1rem}
  table{background:transparent}
  #detail thead{display:table-header-group}
  #detail tbody tr,#detail tfoot tr{display:table-row;border:0;margin:0;background:transparent}
  #detail th,#detail td{display:table-cell;text-align:right;padding:.5rem .625rem;
    border-bottom:1px solid var(--rule)}
  #detail th{background:#EEF1F3;font-size:var(--fs-micro);color:var(--slate);font-weight:700;
    position:sticky;top:0;text-align:right}
  #detail th:first-child,#detail td:first-child{text-align:left}
  #detail td::before{content:none}
  #detail td.mob{display:none}          /* 平板以上改回獨立欄位 */
  #detail td.num{display:table-cell}
  .mobcat{display:none}
  #detail td.nm{background:transparent;font-size:inherit;font-weight:600}
  #detail td.cat{text-align:left;font-size:var(--fs-micro)}
  #detail tfoot td{font-weight:700;border-top:2px solid var(--ink);border-bottom:0;background:#EEF1F3}
  #detail tfoot tr{border:0}

  /* 結構分析兩欄 */
  .split{grid-template-columns:repeat(2,1fr);gap:1.5rem}
  .mrow{grid-template-columns:5rem 1fr 4.5rem}
}

/* ==========================================================================
   斷點二：桌機 1024px 以上
   ========================================================================== */
@media (min-width:64em){
  :root{ --lh:1.7; --lh-loose:1.8;
         --gutter:1.75rem; --section-gap:2.875rem; --dot:0.9375rem; --pad-card:1.375rem; }

  /* KPI 四欄一排 */
  .kpis{grid-template-columns:repeat(4,1fr)}

  /* 兩個年度的方格圖並排比較 */
  .units{grid-template-columns:1fr 1fr;gap:2rem}

  .split{gap:2rem}
  #detail th,#detail td{padding:.55rem .75rem}
}

/* ==========================================================================
   其他情境
   ========================================================================== */
/* 超寬螢幕：內容不再無限拉長 */
@media (min-width:100em){ .wrap{max-width:75rem} }

/* 使用者在系統關閉動態效果 */
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }

/* 列印：去掉底色與互動元素，表格固定用桌機版 */
@media print{
  body{background:#fff}
  .disclosure-body{display:block!important}   /* 列印時強制展開明細 */
  .disclosure summary{display:none}
  .tabs,#tip{display:none}
  section{break-inside:avoid}
  .units{grid-template-columns:1fr 1fr}
  .kpis{grid-template-columns:repeat(4,1fr)}
}
</style>
</head>
<body>
<div id="tip"></div>
<div class="wrap">

<header>
  <h1>專科醫師考試通過率儀表板</h1>
  <p class="sub">113 與 114 年度應考結果分析</p>
  <div class="meta">
    <span id="m-updated"></span>
  </div>
</header>

<section>
  <h2 id="kpi-h">114 年度總覽</h2>
  <p class="lead" id="kpi-lead">下列數字涵蓋部定專科與次專科。</p>
  <div class="kpis" id="kpis"></div>
</section>

<section>
  <h2>每一格代表一位應考醫師</h2>
  <p class="lead">深灰為部定專科通過、綠色為次專科通過、紅色為未通過。滑鼠移到方格可看科別。</p>
  <div class="units" id="units"></div>
</section>

<section id="sec-exc">
  <h2>未通過名單</h2>
  <p class="lead">兩個年度合計的未通過人次，這是輔導資源該優先投入的地方。</p>
  <div class="exc" id="exc"></div>
</section>

<section>
  <h2 id="detail-h">各專科明細</h2>
  <p class="lead">紅底儲存格代表該年度有人未通過；空白「—」代表該年度沒有人報考。</p>
  <details class="disclosure" id="detail-box">
    <summary>
      <span class="lbl" id="lbl-show">展開各專科明細</span>
      <span class="lbl lbl-hide">收合明細</span>
    </summary>
    <div class="disclosure-body">
      <div class="tabs" id="tabs"></div>
      <div style="overflow-x:auto"><table id="detail"></table></div>
    </div>
  </details>
</section>

<section>
  <h2 id="split-h">結構分析</h2>
  <p class="lead">綠色為通過比例，右側淺紅為未通過的缺口。</p>
  <div class="split" id="split"></div>
</section>

<section>
  <h2>觀察重點</h2>
  <ul class="notes" id="obs"></ul>
</section>
</div>

"西醫","name":"內分泌新陳代謝專科","n":2,"p":2,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"國際生活型態醫學","n":3,"p":3,"note":"原始表人數欄填5、名單僅3人，待確認"},{"y":114,"cat":"次專科","field":"西醫","name":"外傷科","n":1,"p":1,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"大腸直腸外科","n":2,"p":2,"note":"含代訓醫師1人"},{"y":114,"cat":"次專科","field":"西醫","name":"婦女泌尿","n":1,"p":1,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"安寧緩和專科","n":1,"p":1,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"心臟血管專科","n":2,"p":2,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"感染症專科","n":1,"p":1,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"消化系內科","n":3,"p":3,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"老年醫學專科","n":2,"p":2,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"胸腔暨重症專科","n":1,"p":1,"note":""},{"y":114,"cat":"次專科","field":"西醫","name":"腎臟科","n":3,"p":3,"note":""}]};
(function(){
var rows = DATA.rows;
var _ys=[]; rows.forEach(function(r){if(_ys.indexOf(r.y)<0)_ys.push(r.y)}); _ys.sort(function(a,b){return a-b});
var YB = _ys[_ys.length-1], YA = _ys.length>1? _ys[_ys.length-2] : YB;
var $ = function(id){return document.getElementById(id)};
var pct = function(p,n){return n? (p/n*100) : null};
var fp = function(v,d){return v===null? '—' : v.toFixed(d===undefined?1:d)+'%'};

document.getElementById('m-updated').textContent = '資料更新：' + DATA.updated;
document.querySelector('header .sub').textContent = YA+' 與 '+YB+' 年度應考結果分析';
document.querySelector('#kpi-h').textContent = YB+' 年度總覽';
document.querySelector('#kpi-lead').textContent = '下列數字涵蓋部定專科與次專科，第二行為與 '+YA+' 年度的比較。';
document.querySelector('#split-h').textContent = '結構分析';
[].forEach.call(document.querySelectorAll('#detail-h'),function(e){e.textContent='各專科明細（'+YA+' vs '+YB+'）'});

function agg(f){var n=0,p=0; rows.forEach(function(r){if(f(r)){n+=r.n;p+=r.p}}); return {n:n,p:p,r:pct(p,n)}}
var A = agg(function(r){return r.y===YA}), B = agg(function(r){return r.y===YB});

/* ---------- KPI ---------- */
function delta(cur,prev,unit,inv){
  var d = cur-prev, s = (d>0?'+':'') + (unit==='%'? d.toFixed(1)+' 個百分點' : d+' 人');
  if(d===0) return '與 '+YA+' 年持平';
  var good = inv ? d<0 : d>0;
  return YA+' 年 ' + (unit==='%'? prev.toFixed(1)+'%' : prev+' 人') + '，<span class="'+(good?'up':'down')+'">'+s+'</span>';
}
$('kpis').innerHTML = [
  {k:'應考人數',v:B.n+' 人',d:delta(B.n,A.n,'人')},
  {k:'通過人數',v:B.p+' 人',d:delta(B.p,A.p,'人')},
  {k:'整體通過率',v:B.r.toFixed(1)+'%',d:delta(B.r,A.r,'%')},
  {k:'未通過人數',v:(B.n-B.p)+' 人',d:delta(B.n-B.p,A.n-A.p,'人',true),cls:' alert'}
].map(function(o){
  return '<div class="kpi'+(o.cls||'')+'"><div class="k">'+o.k+'</div><div class="v">'+o.v+'</div><div class="d">'+o.d+'</div></div>';
}).join('');

/* ---------- unit chart ---------- */
var tip = $('tip');
function unitbox(y){
  var rs = rows.filter(function(r){return r.y===y}).sort(function(a,b){
    return (a.cat===b.cat? 0 : (a.cat==='部定專科'?-1:1)) || a.name.localeCompare(b.name,'zh-Hant');
  });
  var tot=agg(function(r){return r.y===y});
  var dots='', i=0;
  rs.forEach(function(r){
    for(var k=0;k<r.n;k++){
      var fail = k >= r.p;
      dots += '<span class="dot'+(r.cat==='次專科'?' sub':'')+(fail?' f':'')+
        '" style="animation-delay:'+Math.min(i*6,700)+'ms" data-t="'+r.name+'（'+r.cat+'）'+(fail?'　未通過':'　通過')+'"></span>';
      i++;
    }
  });
  return '<div class="unitbox"><h3>'+y+' 年度 <span>'+tot.n+' 人應考</span></h3>'+
    '<div class="grid">'+dots+'</div>'+
    '<div class="unitfoot">通過 <b>'+tot.p+'</b> 人　通過率 <b>'+tot.r.toFixed(1)+'%</b>'+
    (tot.n-tot.p? '　未通過 <b style="color:var(--brick)">'+(tot.n-tot.p)+'</b> 人':'')+'</div></div>';
}
$('units').innerHTML = unitbox(YA) + unitbox(YB);
$('units').insertAdjacentHTML('beforeend',
 '<div class="legend" style="grid-column:1/-1"><span><i style="background:var(--slate)"></i>部定專科通過</span>'+
 '<span><i style="background:var(--teal)"></i>次專科通過</span>'+
 '<span><i style="background:var(--brick)"></i>未通過</span></div>');

document.addEventListener('mouseover',function(e){
  var t=e.target;
  if(t.classList && t.classList.contains('dot')){
    tip.textContent=t.getAttribute('data-t'); tip.style.opacity=1;
    var r=t.getBoundingClientRect();
    tip.style.left=Math.min(r.left, innerWidth-tip.offsetWidth-12)+'px';
    tip.style.top=(r.top-30)+'px';
  } else { tip.style.opacity=0; }
});

/* ---------- exceptions ---------- */
var fails = rows.filter(function(r){return r.p<r.n && (r.y===YA||r.y===YB)}).sort(function(a,b){return b.y-a.y});
$('exc').innerHTML = fails.length? fails.map(function(r){
  return '<div class="excrow"><div class="yr">'+r.y+' 年</div><div class="nm">'+r.name+'</div>'+
   '<div class="no">'+r.cat+'　應考 '+r.n+' 人、通過 '+r.p+' 人'+(r.note? '　·　'+r.note : '')+'</div></div>';
}).join('') : '<div class="excrow"><div class="no">兩年度全數通過。</div></div>';

/* ---------- detail table ---------- */
var filt='all';
function drawTable(){
  var names={}, order=[];
  rows.forEach(function(r){
    if(r.y!==YA&&r.y!==YB) return;
    if(filt!=='all'&&r.cat!==filt) return;
    if(!names[r.name]){names[r.name]={cat:r.cat};order.push(r.name)}
    names[r.name][r.y]=r;
  });
  order.sort(function(a,b){
    var A2=names[a],B2=names[b];
    if(A2.cat!==B2.cat) return A2.cat==='部定專科'?-1:1;
    var an=(A2[YB]||A2[YA]).n, bn=(B2[YB]||B2[YA]).n;
    return bn-an || a.localeCompare(b,'zh-Hant');
  });
  var h='<thead><tr><th>專科別</th><th>類別</th>'+
        '<th>'+YA+' 應考</th><th>'+YA+' 通過</th><th>'+YA+' 通過率</th>'+
        '<th>'+YB+' 應考</th><th>'+YB+' 通過</th><th>'+YB+' 通過率</th></tr></thead><tbody>';
  order.forEach(function(nm){
    var o=names[nm], a=o[YA], b=o[YB];
    function mc(r){ return (r&&r.p<r.n)? ' miss' : '' }   /* 回傳 class 名稱片段，不含屬性 */
    function cell(r,key){ return r? r[key] : '<span class="dash">—</span>' }
    function rate(r){
      if(!r) return '<span class="dash">—</span>';
      var v=pct(r.p,r.n);
      return '<span class="bar'+(v<100?' f':'')+'" style="width:'+(v*0.36)+'px"></span> '+v.toFixed(0)+'%';
    }
    var ma=mc(a), mb=mc(b);
    /* 手機版只顯示 .mob 合併欄，平板以上換成 .num 的獨立欄位（由 CSS 切換） */
    function mobcell(r,y){
      return '<td class="mob'+mc(r)+'" data-label="'+y+' 通過／應考">'+
        (r? r.p+' / '+r.n+' 人' : '<span class="dash">—</span>')+'</td>';
    }
    h+='<tr><td class="nm">'+nm+'<span class="mobcat">・'+o.cat+'</span></td>'+
       '<td class="cat num" data-label="類別">'+o.cat+'</td>'+
       mobcell(a,YA)+
       '<td class="num'+ma+'" data-label="'+YA+' 應考">'+cell(a,'n')+'</td>'+
       '<td class="num'+ma+'" data-label="'+YA+' 通過">'+cell(a,'p')+'</td>'+
       '<td data-label="'+YA+' 通過率" class="rate'+ma+'">'+rate(a)+'</td>'+
       mobcell(b,YB)+
       '<td class="num'+mb+'" data-label="'+YB+' 應考">'+cell(b,'n')+'</td>'+
       '<td class="num'+mb+'" data-label="'+YB+' 通過">'+cell(b,'p')+'</td>'+
       '<td data-label="'+YB+' 通過率" class="rate'+mb+'">'+rate(b)+'</td></tr>';
  });
  var fa=agg(function(r){return r.y===YA&&(filt==='all'||r.cat===filt)});
  var fb=agg(function(r){return r.y===YB&&(filt==='all'||r.cat===filt)});
  h+='</tbody><tfoot><tr><td class="nm">合計<span class="mobcat">・'+
     (filt==='all'?'全部':filt)+'</span></td>'+
     '<td class="cat num" data-label="類別">'+(filt==='all'?'全部':filt)+'</td>'+
     '<td class="mob" data-label="'+YA+' 通過／應考">'+fa.p+' / '+fa.n+' 人</td>'+
     '<td class="num" data-label="'+YA+' 應考">'+fa.n+'</td>'+
     '<td class="num" data-label="'+YA+' 通過">'+fa.p+'</td>'+
     '<td data-label="'+YA+' 通過率">'+fp(fa.r,1)+'</td>'+
     '<td class="mob" data-label="'+YB+' 通過／應考">'+fb.p+' / '+fb.n+' 人</td>'+
     '<td class="num" data-label="'+YB+' 應考">'+fb.n+'</td>'+
     '<td class="num" data-label="'+YB+' 通過">'+fb.p+'</td>'+
     '<td data-label="'+YB+' 通過率">'+fp(fb.r,1)+'</td></tr></tfoot>';
  $('detail').innerHTML=h;
  /* 收合狀態下也讓人知道裡面有多少內容 */
  $('lbl-show').textContent = '展開各專科明細（'+order.length+' 個專科）';
}
$('tabs').innerHTML=[['all','全部'],['部定專科','部定專科'],['次專科','次專科']].map(function(t,i){
  return '<button class="tab" role="tab" aria-selected="'+(i===0)+'" data-f="'+t[0]+'">'+t[1]+'</button>';
}).join('');
$('tabs').addEventListener('click',function(e){
  var b=e.target.closest('.tab'); if(!b)return;
  filt=b.getAttribute('data-f');
  [].forEach.call($('tabs').children,function(c){c.setAttribute('aria-selected',c===b)});
  drawTable();
});
drawTable();

/* ---------- split ---------- */
function mini(title,items){
  return '<div class="mini"><h3>'+title+'</h3>'+items.map(function(it){
    var v=it.r===null?0:it.r;
    return '<div class="mrow"><div>'+it.k+'</div><div class="track"><div class="fill" style="width:'+v+'%"></div></div>'+
      '<div class="val">'+fp(it.r,1)+'</div></div>'+
      '<div style="font-size:12px;color:var(--mute);margin:-4px 0 8px">通過 '+it.p+' 人 / 應考 '+it.n+' 人'+
      (it.n-it.p? '，未通過 '+(it.n-it.p)+' 人':'')+'</div>';
  }).join('')+'</div>';
}
function pack(k,f){var a=agg(f);a.k=k;return a}
function byYear(label,f){
  return mini(label,[YA,YB].map(function(y){
    return pack(y+' 年', function(r){return r.y===y && f(r)});
  }));
}
$('split').innerHTML =
  byYear('部定專科', function(r){return r.cat==='部定專科'}) +
  byYear('次專科',   function(r){return r.cat==='次專科'}) +
  byYear('西醫',     function(r){return r.field==='西醫'}) +
  byYear('牙醫',     function(r){return r.field==='牙醫'});

/* ---------- observations ---------- */
(function(){
  var o=[];
  o.push(YB+' 年整體通過率 '+B.r.toFixed(1)+'%（'+B.p+'/'+B.n+'），'+YA+' 年為 '+A.r.toFixed(1)+'%（'+A.p+'/'+A.n+'）。');
  var pb=agg(function(r){return r.y===YB&&r.cat==='部定專科'}), pa=agg(function(r){return r.y===YA&&r.cat==='部定專科'});
  var dir = pb.r>pa.r? '回升至' : (pb.r<pa.r? '下降至' : '持平於');
  o.push('部定專科由 '+YA+' 年 '+pa.r.toFixed(1)+'% '+dir+' '+YB+' 年 '+pb.r.toFixed(1)+'%。');
  var sb=agg(function(r){return r.y===YB&&r.cat==='次專科'});
  var sa=agg(function(r){return r.y===YA&&r.cat==='次專科'});
  if(sb.n) o.push('次專科應考人數 '+YA+' 年 '+sa.n+' 人、'+YB+' 年 '+sb.n+' 人'+
    (sa.n&&sb.n>sa.n? '，成長 '+Math.round((sb.n/sa.n-1)*100)+'%，反映次專科訓練量能擴增':'')+
    '；'+YB+' 年通過率 '+sb.r.toFixed(1)+'%。');
  var f14=rows.filter(function(r){return r.y===YB&&r.p<r.n}).map(function(r){return r.name});
  var f13=rows.filter(function(r){return r.y===YA&&r.p<r.n}).map(function(r){return r.name});
  var rep=f14.filter(function(x){return f13.indexOf(x)>=0});
  o.push(YB+' 年未通過者為 '+(f14.length?f14.join('、'):'無')+'；'+YA+' 年為 '+(f13.length?f13.join('、'):'無')+'。'+
    (rep.length? '其中 '+rep.join('、')+' 連續兩年出現，建議優先檢視該科的考前準備機制。'
               : '兩年未通過科別完全不重複，顯示為個案而非特定科別的系統性問題。'));
  var dnA=agg(function(r){return r.y===YA&&r.field==='牙醫'}), dnB=agg(function(r){return r.y===YB&&r.field==='牙醫'});
  if(dnA.n+dnB.n) o.push('牙科系統兩年合計 '+(dnA.n+dnB.n)+' 人次應考、通過 '+(dnA.p+dnB.p)+' 人次'+
    ((dnA.p+dnB.p)===(dnA.n+dnB.n)? '，全數通過。' : '。'));
  var big=null; rows.filter(function(r){return r.y===YB}).forEach(function(r){if(!big||r.n>big.n)big=r});
  if(big) o.push(big.name+'為 '+YB+' 年最大應考族群（'+big.n+' 人），通過率 '+pct(big.p,big.n).toFixed(1)+'%。'+
    /* 這句是人工加的背景說明，只在最大應考族群仍是內科時才顯示 */
    (big.name==='內科'? '內科部設有考前複習班，其做法可作為其他科部參考。' : ''));
  $('obs').innerHTML=o.map(function(t){return '<li>'+t+'</li>'}).join('');
})();

})();
</script>
</body>
</html>
